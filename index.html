<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>安全連線中...</title>
  <style>
    body{background:#0f172a;color:#e2e8f0;font-family:sans-serif;display:flex;justify-content:center;align-items:center;height:100vh;margin:0}
    .loader{border:3px solid rgba(255,255,255,.1);border-top-color:#06b6d4;border-radius:50%;width:40px;height:40px;animation:spin 1s linear infinite;margin:0 auto 15px}
    @keyframes spin{to{transform:rotate(360deg)}}
    .text{font-size:14px;letter-spacing:2px;color:#94a3b8;text-align:center}
    .open-btn{display:none;margin:20px auto 0;padding:14px 32px;background:linear-gradient(135deg,#06b6d4,#0891b2);color:#fff;border:none;border-radius:12px;font-size:16px;font-weight:bold;cursor:pointer;letter-spacing:1px;text-decoration:none}
  </style>
</head>
<body>
  <div style="text-align:center">
    <div class="loader" id="spinner"></div>
    <div class="text" id="statusText">正在建立安全連線...</div>
    <a class="open-btn" id="openBtn" href="https://ruyi-club.nightowlowl.workers.dev/">👆 點擊開啟</a>
  </div>
  <script>
    var TARGET = "https://ruyi-club.nightowlowl.workers.dev/";
    var ua = navigator.userAgent || '';
    var isLine = /Line\//i.test(ua);
    var isInApp = isLine || /FBAV|FBAN|Instagram|Twitter|MicroMessenger|WeChat/i.test(ua);

    if (isInApp) {
      // LINE / FB / IG 等 in-app browser → 嘗試強制外部瀏覽器
      document.getElementById('statusText').textContent = '正在開啟外部瀏覽器...';

      // 方法1: Android intent (Chrome)
      if (/android/i.test(ua)) {
        location.href = 'intent://' + TARGET.replace(/^https?:\/\//, '') + '#Intent;scheme=https;action=android.intent.action.VIEW;end';
      }
      // 方法2: iOS Safari 嘗試
      else if (/iPhone|iPad/i.test(ua)) {
        // iOS LINE 無法強制開外部，顯示按鈕讓用戶手動開
        document.getElementById('spinner').style.display = 'none';
        document.getElementById('statusText').textContent = 'LINE 無法自動開啟外部瀏覽器';
        var btn = document.getElementById('openBtn');
        btn.style.display = 'inline-block';
        btn.href = TARGET;
      }
      // 備用：直接跳
      setTimeout(function(){ window.location.replace(TARGET); }, 1500);
    } else {
      // 一般瀏覽器 → 直接跳轉
      setTimeout(function(){ window.location.replace(TARGET); }, 500);
    }
  </script>
</body>
</html>
